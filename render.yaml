# Render blueprint — FREE tier (see docs/FREE_DEPLOYMENT.md).
#
# The backend needs functions/src (shared Cloud-Functions logic, loaded by
# relative require from backend/src/firebase/coreLoader.js), so the service
# builds from the repository root instead of rootDir: backend.
#
# Free web services: no persistent disk (SQLite file is lost on every
# restart/deploy; Firestore is the source of truth), and they SLEEP after
# ~15 min without inbound HTTP traffic. While asleep the trigger runner is
# stopped: no vital checks and no push notifications until the next request
# wakes it. Keep it awake with an external uptime monitor hitting /health,
# or run the backend on the clinic laptop instead.
services:
  - type: web
    name: mindtwin-backend
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node index.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - functions/src/**
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      # Paste the Firebase service-account JSON (raw or base64). Never commit it.
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # UDP LAN discovery is useless in the cloud.
      - key: LAN_DISCOVERY_ENABLED
        value: "false"
      # Trigger-runner state doc _runner/render (one per instance).
      - key: RUNNER_INSTANCE_ID
        value: render
      - key: FUNCTIONS_RUNNER_ENABLED
        value: "true"

  - type: web
    name: mindtwin-ml
    runtime: docker
    rootDir: ml_service
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
