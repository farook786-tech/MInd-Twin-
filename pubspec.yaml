name: mindtwin
description: MindTwin - AI Digital Twin Mental Health System. High-fidelity, real-time medical SaaS ecosystem with personalized digital twin for every patient.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.1

  # UI Components
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0

  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  
  # Database & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Voice Recording
  record: ^6.2.0
  audioplayers: ^5.2.1
  
  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.10
  
  # Security & Utilities
  crypto: ^3.0.3
  file_picker: ^10.3.10
  permission_handler: ^11.0.0
  flutter_blue_plus: ^1.35.5
  health: ^11.1.1
  http: ^1.1.0
  dart_jsonwebtoken: ^2.12.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  #   - assets/animations/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: fonts/Poppins-Regular.ttf
  #       - asset: fonts/Poppins-Bold.ttf
  #         weight: 700
